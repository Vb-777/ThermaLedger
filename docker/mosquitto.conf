listener 1883
allow_anonymous true

# Local development only. In production the broker takes per-device client
# certificates over mutual TLS - the meter serial is the certificate CN, so the
# identity the broker authenticates is the identity readings are filed under.
# See `manage.py ingest_mqtt --tls-ca/--tls-cert/--tls-key`.
#
# listener 8883
# allow_anonymous false
# cafile   /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/broker.crt
# keyfile  /mosquitto/certs/broker.key
# require_certificate true
# use_identity_as_username true
